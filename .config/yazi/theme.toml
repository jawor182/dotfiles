[flavor]
dark = "gruvbox-dark"

[icon]

prepend_dirs = [
	{ name = ".config",     text = "", fg = "#83a598" },
	{ name = ".git",        text = "", fg = "#83a598" },
	{ name = ".npm",        text = "", fg = "#83a598" },
    { name = ".github",     text = "", fg = "#83a598" },
]

prepend_exts = [

    { name = "djvu",        text = "", fg = "#fabd2f" },
    { name = "epub",        text = "", fg = "#fabd2f" },
    { name = "avi",         text = "", fg = "#b16286" },
    { name = "png",         text = "", fg = "#b16286" },
    { name = "web",         text = "", fg = "#b16286" },
    { name = "ico",         text = "", fg = "#b16286" },
    { name = "jpg",         text = "", fg = "#b16286" },
    { name = "jpeg",        text = "", fg = "#b16286" },
    { name = "gif",         text = "", fg = "#b16286" },
    { name = "svg",         text = "", fg = "#b16286" },
    { name = "tif",         text = "", fg = "#b16286" },
    { name = "mp3",         text = "", fg = "#689d6a" },
    { name = "ogg",         text = "", fg = "#689d6a" },
    { name = "opu",         text = "", fg = "#689d6a" },
    { name = "m4a",         text = "", fg = "#689d6a" },
    { name = "fla",         text = "", fg = "#689d6a" },
    { name = "wav",         text = "", fg = "#689d6a" },
    { name = "mp4",         text = "", fg = "#689d6a" },
    { name = "mkv",         text = "", fg = "#b16286" },
    { name = "mp4",         text = "", fg = "#b16286" },
    { name = "web",         text = "", fg = "#b16286" },
    { name = "mpe",         text = "", fg = "#b16286" },
    { name = "avi",         text = "", fg = "#b16286" },
    { name = "mov",         text = "", fg = "#b16286" },
    { name = "mpg",         text = "", fg = "#b16286" },
    { name = "wmv",         text = "", fg = "#b16286" },
    { name = "flv",         text = "", fg = "#b16286" },
    { name = "m4b",         text = "", fg = "#b16286" },
    { name = "dwm",         text = "", fg = "#1177AA" },
    { name = "sway",        text = "", fg = "#68751C" },
    { name = "tinywl",      text = "", fg = "#FFBC00" },
    { name = "1",           text = "" },
    { name = "inf",         text = "" },
    { name = "nfo",         text = "" },

]

prepend_conds = [
	{ if = "dir",           text = "󰉋", fg = "#83a598" },
    { if = "orphan",        text = "", fg = "#fb4934" },
    { if = "link",          text = "", fg = "#83a598" },
]

[filetype]

rules = [

  { url = "*djvu", fg = "#fabd2f" },
  { url = "*epub", fg = "#fabd2f" },

  # Images
  { mime = "image/*", fg = "#b16286" },

  # Media
  { mime = "{audio/*}", fg = "#689d6a" },
  { mime = "{video/*}", fg = "#b16286" },

  # Archives
  { mime = "application/*zip", fg = "#fb4934" },
  { mime = "application/x-{tar,bzip*,7z-compressed,xz,rar}", fg = "#fb4934" },

  # Documents
  { mime = "application/{pdf,doc,rtf,vnd.*}", fg = "#fb4934" },

  # Books

  # Fallback
  { url = "*", fg = "#ebdbb2" },
  { url = "*/", fg = "#83a598" },

]
