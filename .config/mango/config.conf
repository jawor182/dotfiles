# Monitor Rules
monitorrule=name:DP-1,scale:1.25,width:2560,height:1440,x:1920,y:0,refresh:165,vrr:1
monitorrule=name:eDP-1,scale:1.25,width:1920,height:1080,x:0,y:0,refresh:60,vrr:1
monitorrule=name:HDMI-A-1,scale:1,width:1920,height:1080,x:0,y:0,refresh:75,vrr:1

exec-once=~/.config/mango/autostart.sh

# Envs
env=XCURSOR_SIZE,24
env=XCURSOR_THEME,breeze_cursors
env=QT_QPA_PLATFORMTHEME,gtk3
env=QT_QPA_PLATFORM,wayland
env=XDG_CURRENT_DESKTOP,Mango
env=XDG_SESSION_TYPE,wayland
env=XDG_SESSION_DESKTOP,Mango
env=ELECTRON_FORCE_DARK_MODE,true
env=ELECTRON_OZONE_PLATFORM_HINT,wayland
env=TERMINAL,footclient
env=WLR_DRM_NO_ATOMIC,1
env=GBM_BACKEND,nvidia-drm
env=__GLX_VENDOR_LIBRARY_NAME,nvidia
env=LIBVA_DRIVER_NAME,nvidia
env=__GL_GSYNC_ALLOWED,true
env=NVD_BACKEND,direct
env=WLR_RENDER_DRM_FENCE,1

# Binds
bind=SUPER+SHIFT,Q,quit                 
bind=SUPER,r,reload_config
bind=SUPER+SHIFT,Return,zoom
bind=SUPER,q,killclient,                
bind=SUPER+SHIFT,F,togglefullscreen,    
bind=SUPER+SHIFT,space,togglefloating,            
bind=SUPER,v,toggle_all_floating
bind=SUPER,j,focusstack,next
bind=SUPER,k,focusstack,prev
bind=SUPER,g,togglegaps
bind=SUPER,c,centerwin
bind=SUPER+SHIFT,J,exchange_stack_client,next
bind=SUPER+SHIFT,K,exchange_stack_client,prev

# Tiling Layout Adjustments
bind=SUPER+SHIFT,I,incnmaster,+1
bind=SUPER+SHIFT,D,incnmaster,-1
bind=SUPER,l,setmfact, +0.05
bind=SUPER,h,setmfact, -0.05
bind=SUPER,t,setlayout,tile
bind=SUPER,y,setlayout,monocle
bind=SUPER,s,setlayout,scroller

# Scratchpads
bind=SUPER+CTRL,Return,toggle_named_scratchpad,spterm,none,footclient -a spterm
bind=SUPER+CTRL,n,toggle_named_scratchpad,spnotes,none,footclient -a spnotes -e zsh -c "cd $HOME/dox/notes && $EDITOR"
bind=SUPER+CTRL,c,toggle_named_scratchpad,spcal,none,footclient -a spcal -e calcurse
bind=SUPER+CTRL,q,toggle_named_scratchpad,spqalc,none,footclient -a spqalc -e qalc
bind=SUPER,m,toggle_named_scratchpad,spmusic,none,footclient -a spmusic -e ncmpcpp

# Programs
bind=SUPER,Return,spawn,footclient
bind=SUPER,d,spawn,bemenu-run
bind=SUPER,f,spawn,$TERMINAL -e lf
bind=SUPER,w,spawn,librewolf
bind=SUPER,e,spawn,$TERMINAL -T email -e neomutt
bind=SUPER+SHIFT,N,spawn,$TERMINAL -T news -e newsboat
bind=SUPER,n,spawn_shell,foot -e sh -c "cd ~/dox/notes && $EDITOR"
bind=SUPER,p,spawn,keepassxc
bind=SUPER+SHIFT,B,spawn,calibre
bind=SUPER+SHIFT,C,spawn,discord
bind=SUPER,Escape,spawn_shell,waylock -fail-color 0xfb4934 -init-color 0x282828 -input-color 0xd65d0e -ignore-empty-password -fork-on-lock

# Scripts
bind=SUPER+SHIFT,A,spawn,mpvq addclip
bind=SUPER+SHIFT,M,spawn,mpvq play
bind=SUPER+SHIFT,Escape,spawn,powermenu
bind=SUPER+SHIFT,P,spawn,colorpicker
bind=SUPER+SHIFT,S,spawn,screenshot
bind=NONE,Print,spawn,screenshot
bind=SUPER+SHIFT,R,spawn,killall -SIGUSR2 waybar
bind=SUPER+SHIFT,W,spawn, wallpaper open
bind=SUPER+CTRL,w,spawn, wallpaper random
bind=SUPER,grave,spawn, bemenubookmarks select
bind=SUPER+SHIFT,grave,spawn, bemenubookmarks select_browser
bind=SUPER+ALT,b,spawn, bemenubookmarks add
bind=SUPER+SHIFT,U,spawn, bemenuunicode

# mpd control
bindl=SUPER+ALT,p,spawn, mpc toggle
bindl=SUPER+ALT,period,spawn, mpc next
bindl=SUPER+ALT,comma,spawn, mpc prev
bindl=SUPER+ALT,equal,spawn, mpc volume +5
bindl=SUPER+ALT,minus,spawn, mpc volume -5
bindl=SUPER+ALT,s,spawn_shell, mpc pause && mpc seek 0
bindl=SUPER+ALT,0,spawn, mpc seek 0

# Media keys
bindl=NONE,XF86AudioRaiseVolume,spawn , wpctl set-volume -l 1 @DEFAULT_AUDIO_SINK@ 5%+
bindl=NONE,XF86AudioLowerVolume, spawn, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindl=NONE,XF86AudioMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SINK@ toggle
bindl=NONE,XF86AudioMicMute, spawn, wpctl set-mute @DEFAULT_AUDIO_SOURCE@ toggle
bindl=NONE,XF86MonBrightnessUp, spawn, brightnessctl s 10%+
bindl=NONE,XF86MonBrightnessDown, spawn, brightnessctl s 10%-
bindl=NONE,XF86AudioNext, spawn, playerctl next
bindl=NONE,XF86AudioPause, spawn, playerctl play-pause
bindl=NONE,XF86AudioPlay, spawn, playerctl play-pause
bindl=NONE,XF86AudioPrev, spawn, playerctl previous

# Blur
blur=1
blur_layer=0
blur_optimized=0
blur_params_num_passes = 4
blur_params_radius = 2
blur_params_noise = 0.02
blur_params_brightness = 0.9
blur_params_contrast = 0.9
blur_params_saturation = 1.2

# Corners
no_radius_when_single=0
border_radius=15

# Focus opacity
focused_opacity=1.0
unfocused_opacity=1.0

# Animations
animations=1
layer_animations=0
animation_type_open=zoom
animation_type_close=none
animation_fade_in=1
animation_fade_out=1
tag_animation_direction=1
zoom_initial_ratio=0.5
fadein_begin_opacity=0.5
fadeout_begin_opacity=0.8
animation_duration_move=200
animation_duration_open=200
animation_duration_tag=200
animation_duration_close=200
animation_curve_open=0.4,1,0.2,1
animation_curve_move=0.4,1,0.2,1
animation_curve_tag=0.4,1,0.2,1
animation_curve_close=0.08,0.9,0,1

# Tile layout config
new_is_master=0
default_mfact=0.50
default_nmaster=1
smartgaps=0

# Scroller layout config
scroller_structs=20
scroller_default_proportion=0.95
scroller_focus_center=0
scroller_prefer_center=0
scroller_prefer_overspread=1
edge_scroller_pointer_focus=1
scroller_default_proportion_single=1.0
scroller_proportion_preset=0.5,0.8,1.0

# Overview mode config
hotarea_size=10
enable_hotarea=0
ov_tab_mode=0
overviewgappi=5
overviewgappo=30

# Misc settings
warpcursor=1
cursor_size=24
sloppyfocus=1
focus_on_activate=1
focus_cross_monitor=1
focus_cross_tag=1
scratchpad_cross_monitor=1
enable_floating_snap=0
snap_distance=32
drag_tile_to_tile=1
syncobj_enable=0
view_current_to_back=0
single_scratchpad=0
allow_tearing=1
axis_bind_apply_timeout=100
no_border_when_single=0

# Keyboard
repeat_rate=60
repeat_delay=300
xkb_rules_layout=pl

# Trackpad 
tap_to_click=1
tap_and_drag=1
drag_lock=1
trackpad_natural_scrolling=0
disable_while_typing=1
left_handed=0
middle_button_emulation=1
swipe_min_threshold=20

# Mouse
mouse_natural_scrolling=0

# Appearance
gappih=8
gappiv=8
gappoh=8
gappov=8
borderpx=4
rootcolor=0xd65d0eff
bordercolor=0x928374ff
focuscolor=0xd65d0eff
maximizescreencolor=0xf5e0dcff
urgentcolor=0xfb4934ff
scratchpadcolor=0xd65d0eff

scratchpad_width_ratio=0.5
scratchpad_height_ratio=0.6


# Tags
tagrule=id:1,layout_name:tile
tagrule=id:2,layout_name:tile
tagrule=id:3,layout_name:tile
tagrule=id:4,layout_name:tile
tagrule=id:5,layout_name:tile
tagrule=id:6,layout_name:tile
tagrule=id:7,layout_name:tile
tagrule=id:8,layout_name:tile
tagrule=id:9,layout_name:tile

bind=SUPER,TAB,view,-1

bind=SUPER,1,view,1
bind=SUPER,2,view,2
bind=SUPER,3,view,3
bind=SUPER,4,view,4
bind=SUPER,5,view,5
bind=SUPER,6,view,6
bind=SUPER,7,view,7
bind=SUPER,8,view,8
bind=SUPER,9,view,9

bind=SUPER+CTRL,1,toggleview,1
bind=SUPER+CTRL,2,toggleview,2
bind=SUPER+CTRL,3,toggleview,3
bind=SUPER+CTRL,4,toggleview,4
bind=SUPER+CTRL,5,toggleview,5
bind=SUPER+CTRL,6,toggleview,6
bind=SUPER+CTRL,7,toggleview,7
bind=SUPER+CTRL,8,toggleview,8
bind=SUPER+CTRL,9,toggleview,9
bind=SUPER,0,view,0

bind=SUPER+SHIFT,1,tagsilent,1
bind=SUPER+SHIFT,2,tagsilent,2
bind=SUPER+SHIFT,3,tagsilent,3
bind=SUPER+SHIFT,4,tagsilent,4
bind=SUPER+SHIFT,5,tagsilent,5
bind=SUPER+SHIFT,6,tagsilent,6
bind=SUPER+SHIFT,7,tagsilent,7
bind=SUPER+SHIFT,8,tagsilent,8
bind=SUPER+SHIFT,9,tagsilent,9

bind=SUPER,comma,focusmon,left
bind=SUPER,period,focusmon,right
bind=SUPER+SHIFT,comma,tagmon,left
bind=SUPER+SHIFT,period,tagmon,right

# Mouse binds
mousebind=SUPER,btn_left,moveresize,curmove
mousebind=SUPER,btn_right,moveresize,curresize

# Passthrough
keymode=default
bind=SUPER,F11,setkeymode,passthrough

keymode=passthrough
bind=SUPER,F11,setkeymode,default


# Rules
windowrule=title:email,monitor:^(DP-1|eDP-1)$,tags:3
windowrule=title:news,monitor:^(DP-1|eDP-1)$,tags:5
windowrule=appid:calibre-gui,monitor:^(DP-1|eDP-1)$,tags:4
windowrule=appid:discord,monitor:^(HDMI-A-1|eDP-1)$,tags:4,isopensilent:1
windowrule=appid:steam,monitor:^(HDMI-A-1|eDP-1)$,tags:3,isopensilent:1,istagsilent:1
windowrule=appid:mpvq,monitor:^(HDMI-A-1|eDP-1)$,tags:1,isopensilent:1
windowrule=appid:org.keepassxc.KeePassXC,monitor:^(DP-1|eDP-1)$,tags:9
windowrule=appid:^(floatingterm|foot|footclient)$,isterm:1
windowrule=appid:^(floatingterm)$,isfloating:1
windowrule=isnamedscratchpad:1,width:1200,height:800,appid:^(spterm|spcal|spqalc|spnotes|spmusic)$,isfloating:1
windowrule=isnamedscratchpad:1,width:1200,height:800,appid:^(spterm)$,isterm:1
windowrule=appid:xdg-desktop-portal,width:1200,height:800
windowrule=appid:^(wev)$,noswallow:1
windowrule=title:^(Event Tester)$,noswallow:1
